name: Assist automations

# Triggers scheduled Assist automations and integration jobs (Xero sync,
# bank holidays). Works on any Vercel plan.
# Set two repository secrets to turn it on:
#   APP_URL      e.g. https://pleasant.example.com
#   CRON_SECRET  the same value as the app's CRON_SECRET environment variable
# Without them this workflow does nothing.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-due:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run due automations
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/assist"

      - name: Run integration jobs
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            exit 0
          fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/integrations"
